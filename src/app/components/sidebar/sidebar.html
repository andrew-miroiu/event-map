<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">{{ events.length }} evenimente</div>
        <input 
            type="date" 
            class="date-filter"
            [value]="selectedDate"
            (change)="onDateChange($event)" 
        />
  </div>

  <div class="quick-filters">
    <button class="quick-btn" (click)="setQuickDate('today')">Azi</button>
    <button class="quick-btn" (click)="setQuickDate('tomorrow')">Mâine</button>
    <button class="quick-btn" (click)="setQuickDate('week')">Săptămâna</button>
    <button class="quick-btn" (click)="setQuickDate('')">Toate</button>
  </div>

  <div class="events-list">
    @for (event of events; track event.id) {
      <div class="event-card" (click)="eventSelected.emit(event.id)">
        <div class="event-category">{{ event.category }}</div>
        <div class="event-title">{{ event.title }}</div>
        <div class="event-meta">
          <span>{{ event.date }}</span>
          <span>{{ event.time }}</span>
          <span>{{ event.price === 0 ? 'Gratuit' : event.price + ' RON' }}</span>
        </div>
      </div>
    }
  </div>
</div>
