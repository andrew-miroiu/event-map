<div class="map-page">
  
  <app-navbar (search)="onSearch($event)"></app-navbar>

  <div class="map-layout">
    <div #mapContainer class="map-container"></div>
    
    <button class="burger-btn" (click)="toggleSidebar()">
      {{ isSidebarOpen ? '✕' : '☰' }}
    </button>

    @if (isSidebarOpen) {
      <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
    }

    <div class="sidebar-wrapper" [hidden]="!isSidebarOpen">
      <app-sidebar 
        [searchTerm]="searchTerm" 
        [selectedDate]="selectedDate()"
        [selectedDateTo]="selectedDateTo()"
        (eventSelected)="goToEvent($event)"
        (dateSelected)="changeDate($event)">
      </app-sidebar>
    </div>
  </div>

</div>
